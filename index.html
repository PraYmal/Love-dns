<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Костыли Макса</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff6a1a'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%2317171a' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Старые ссылки (из Telegram с ?qr=…, ?perf=1 и т. п.) ведут сразу в переносы с теми же параметрами */
(function () {
  try {
    var s = location.search, h = location.hash;
    if (s || h) { location.replace('app/' + s + h); return; }
    var t = localStorage.getItem('wt_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#17171a; --card:#1f2023; --card-hi:#2a2b2f; --line:#3a3b40; --text:#eceef1; --dim:#9a9ba3;
  --orange:#ff6a1a; --teal:#55c7bc; --on-accent:#17171a;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef0f4; --card:#ffffff; --card-hi:#f3f4f7; --line:#d5d8de; --text:#1a1c20; --dim:#5d6068;
  --orange:#d9530a; --teal:#0e5a55; --on-accent:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh; padding:24px 16px;
}
main{width:100%; max-width:760px}
h1{margin:0 0 6px; font-size:26px; font-weight:700; letter-spacing:-.01em}
.lead{margin:0 0 22px; color:var(--dim)}
.grid{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:640px){ .grid{grid-template-columns:1fr 1fr} }
a.card{
  display:flex; flex-direction:column; gap:10px; padding:20px 20px 18px;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  color:inherit; text-decoration:none; min-height:168px;
  border-top:4px solid var(--acc);
  transition:background .15s, transform .15s;
}
a.card:hover{background:var(--card-hi)}
a.card:active{transform:scale(.99)}
a.card:focus-visible{outline:3px solid var(--acc); outline-offset:3px}
.tool{--acc:var(--orange)} .guide{--acc:var(--teal)}
.mark{
  width:44px; height:44px; border-radius:10px; background:var(--acc); color:var(--on-accent);
  display:grid; place-items:center; font-weight:800; font-size:15px; letter-spacing:.02em;
}
.name{font-size:21px; font-weight:700; margin-top:2px}
.desc{color:var(--dim); flex:1}
.go{color:var(--acc); font-weight:600}
@media (prefers-reduced-motion:reduce){ a.card{transition:none} }
</style>
</head>
<body>
<main>
  <h1>Костыли Макса</h1>
  <p class="lead">Выберите, что открыть.</p>
  <div class="grid">
    <a class="card tool" href="app/">
      <span class="mark" aria-hidden="true">DNS</span>
      <span class="name">Переносы</span>
      <span class="desc">Учёт перемещений товара по ячейкам: создать, выполнить, посмотреть очередь и историю.</span>
      <span class="go">Открыть переносы</span>
    </a>
    <a class="card guide" href="guide/">
      <span class="mark" aria-hidden="true">IS</span>
      <span class="name">Обучение</span>
      <span class="desc">Руководство по системе DNS IS:WE: 90 инструкций со скриншотами по разделам, с поиском.</span>
      <span class="go">Открыть обучение</span>
    </a>
  </div>
</main>
</body>
</html>
